# ---------------- Actions (HTTP request templates run by the relay) ----------------
actions:
  cam_front_preset_1:
    method: GET
    url: "http://192.168.1.50:81/cam/front/pos=101"      # BI PTZ preset 1 (pos=100+n)
    headers: {Authorization: "Basic ${BI_BASIC}"}
  kuma_pause_acme:
    method: POST
    url: "http://127.0.0.1:9000/kuma/pause"              # your own helper endpoint / MCP bridge
    headers: {Authorization: "Bearer ${HELPER_TOKEN}"}
    json: {tag: "ACME", minutes: 60}
  shelly_shop_lights_toggle:
    method: POST
    url: "https://shelly-55-eu.shelly.cloud/device/relay/control"
    data: {auth_key: "${SHELLY_AUTH_KEY}", id: "a4cf12f4e8b2", channel: 0, turn: "toggle"}
    toggle_tile: shelly_shop_lights
  # Any action may set `demo: true` to just return success without a request.

# ---------------- Button decks (tabs on the right of the board) ----------------
decks:
  - name: Morning
    buttons:
      - label: Front Door Cam
        action: cam_front_preset_1
        icon: 📷
        confirm: false
      - label: "Pause Kuma: ACME"
        action: kuma_pause_acme
        icon: ⏸
        confirm: true          # hold-to-confirm 1.5s
      - label: Shop Lights
        action: shelly_shop_lights_toggle
        icon: 💡
        tile: shelly_shop_lights   # button shows that tile's state/colour
  - name: Evening
    buttons:
      - label: Shop Lights
        action: shelly_shop_lights_toggle
        icon: 💡
        tile: shelly_shop_lights
