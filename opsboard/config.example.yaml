# opsboard relay config. Copy to /etc/opsboard/config.yaml.
# Any string may contain ${ENV_VAR}; values come from /etc/opsboard/env (loaded by systemd).
board_name: "Acme MSP Ops"
host: 0.0.0.0
port: 8080
poll_interval: 30            # default seconds between polls (each block may override)
# token: "..."              # prefer BOARD_TOKEN in /etc/opsboard/env

# Optional: where /api/ask forwards transcripts. POST {text, source}; reply JSON {reply: "..."} or plain text.
# ask_webhook_url: "http://127.0.0.1:9000/ask"
# ask_webhook_token: "${ASK_TOKEN}"

# ---------------- Blue Iris (JSON API, creds never reach the browser) ----------------
